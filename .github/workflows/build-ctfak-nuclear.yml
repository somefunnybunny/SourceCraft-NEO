name: Build CTFAK Nuclear Hybrid

on:
  push:
    branches:
      - ctfak-nuclear-build-temp
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Reconstruct CTFAK-Nuclear
        shell: pwsh
        run: |
          git clone https://github.com/nuclearrt/CTFAK-Nuclear.git CTFAK
          git -C CTFAK checkout f38ba7951f5fa9d714dc5d97772882ea6aa61717
          git clone --depth 1 https://github.com/nuclearrt/CTFAK-Nuclear.git NuclearCurrent

          Copy-Item CTFAK\Core\CTFAK.Core\Tools\IFusionTool.cs IFusionTool.cs
          Copy-Item CTFAK\Core\CTFAK.Core\EXE\ExeFileReader.cs ExeFileReader.cs
          Copy-Item CTFAK\Core\CTFAK.Core\EXE\PackData.cs PackData.cs
          Remove-Item -Recurse -Force CTFAK\Core\CTFAK.Core
          Copy-Item -Recurse NuclearCurrent\Core\CTFAK.Core CTFAK\Core\CTFAK.Core
          New-Item -ItemType Directory -Force CTFAK\Core\CTFAK.Core\Tools | Out-Null
          New-Item -ItemType Directory -Force CTFAK\Core\CTFAK.Core\EXE | Out-Null
          Copy-Item IFusionTool.cs CTFAK\Core\CTFAK.Core\Tools\IFusionTool.cs
          Copy-Item ExeFileReader.cs CTFAK\Core\CTFAK.Core\EXE\ExeFileReader.cs
          Copy-Item PackData.cs CTFAK\Core\CTFAK.Core\EXE\PackData.cs

          $gameData = Get-Content CTFAK\Core\CTFAK.Core\CCN\GameData.cs -Raw
          $gameData = $gameData.Replace('        public bool Exe_Only;', "        public bool Exe_Only;`r`n`r`n        public PackData packData;")
          Set-Content CTFAK\Core\CTFAK.Core\CCN\GameData.cs $gameData -Encoding utf8

          $cli = Get-Content CTFAK\Interface\CTFAK.Cli\CTFAK.Cli.csproj -Raw
          $cli = $cli.Replace('net6.0-windows', 'net9.0-windows')
          Set-Content CTFAK\Interface\CTFAK.Cli\CTFAK.Cli.csproj $cli -Encoding utf8

          $dumper = Get-Content CTFAK\Plugins\Dumper\Dumper.csproj -Raw
          $dumper = $dumper.Replace('net6.0-windows', 'net9.0-windows')
          Set-Content CTFAK\Plugins\Dumper\Dumper.csproj $dumper -Encoding utf8

          $simple = Get-Content CTFAK\Plugins\Dumper\SimpleDumper.cs -Raw
          $simple = $simple.Replace('var packdata = reader.getGameData().packData.Items;', 'var packdata = new List<dynamic>();')
          Set-Content CTFAK\Plugins\Dumper\SimpleDumper.cs $simple -Encoding utf8

          $sorted = Get-Content CTFAK\Plugins\Dumper\SortedImageDumper.cs -Raw
          $sorted = $sorted.Replace('reader.getGameData().frames', 'reader.getGameData().Frames')
          $sorted = $sorted.Replace('Settings.F3', 'Settings.gameType.HasFlag(Settings.GameType.F3)')
          $sorted = $sorted.Replace('Settings.Android', 'Settings.gameType.HasFlag(Settings.GameType.ANDROID)')
          $sorted = $sorted.Replace('Settings.iOS', 'Settings.gameType.HasFlag(Settings.GameType.IOS)')
          Set-Content CTFAK\Plugins\Dumper\SortedImageDumper.cs $sorted -Encoding utf8

          $program = Get-Content CTFAK\Interface\CTFAK.Cli\Program.cs -Raw
          $program = $program.Replace('        CTFAK.CTFAKCore.Init();', '')
          $program = $program.Replace('gameParser.getGameData().frames', 'gameParser.getGameData().Frames')
          $program = $program.Replace('path = ApkFileReader.ExtractCCN(path);', 'throw new NotSupportedException("APK support is not included in this reconstructed build.");')
          Set-Content CTFAK\Interface\CTFAK.Cli\Program.cs $program -Encoding utf8

      - name: Build Dumper plugin
        shell: pwsh
        run: |
          dotnet build CTFAK\Plugins\Dumper\Dumper.csproj -c Release

      - name: Publish self-contained CLI
        shell: pwsh
        run: |
          dotnet publish CTFAK\Interface\CTFAK.Cli\CTFAK.Cli.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Package Dumper and requirements
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish\Plugins | Out-Null
          Copy-Item CTFAK\Plugins\Dumper\bin\Release\net9.0-windows\Dumper.dll publish\Plugins\ -Force
          if (Test-Path CTFAK\Plugins\Dumper\bin\Release\net9.0-windows\Dumper.pdb) {
            Copy-Item CTFAK\Plugins\Dumper\bin\Release\net9.0-windows\Dumper.pdb publish\Plugins\ -Force
          }

          Invoke-WebRequest -Uri "https://github.com/CTFAK/.github/raw/main/ctfakrequirements.zip" -OutFile requirements.zip
          Expand-Archive requirements.zip -DestinationPath publish -Force

          @"
          This is an unofficial reconstructed CTFAK-Nuclear build.
          CLI/plugins are from CTFAK-Nuclear commit f38ba7951f5fa9d714dc5d97772882ea6aa61717.
          CTFAK.Core is from current CTFAK-Nuclear master at build time.
          CLI and Dumper were retargeted to .NET 9 and the CLI was published self-contained for win-x64.
          "@ | Set-Content publish\BUILD-NOTES.txt -Encoding utf8

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CTFAK-Nuclear-hybrid-win-x64
          path: publish
          if-no-files-found: error
